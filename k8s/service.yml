apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: django-ns
spec:
  type: NodePort           # Internal IP only
  selector:
    app: notes-app         # Must match the labels on your backend Pods
  ports:
    - protocol: TCP
      port: 8000             # The port the service listens on inside the cluster
      targetPort: 8000   
      nodePort: 30080
